<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <div class="calculator">

            <header class="calculator-header">
                <div class="calculator-top-bar">
                    <button id="historyToggle" class="history-toggle-btn" type="button" aria-label="Toggle calculation history" title="View Calculation History">
                        🕒 History
                    </button>
                </div>
                <div class="calculator-icon">✳</div>
                <h1>My Calculator</h1>
                <p class="subtitle">Simple. Fast. Accurate.</p>
            </header>

            <div class="display-container">
                <span class="display-label">YOUR CALCULATION</span>
                <input type="text" id="display" value="0" readonly aria-label="Calculator display">
            </div>

            <div class="buttons">
                <!-- Row 1: Scientific Operations (Square Root, Square, Power, Backspace) -->
                <button type="button" onclick="squareRoot()" class="scientific" id="btn-sqrt" aria-label="Square Root">√</button>
                <button type="button" onclick="square()" class="scientific" id="btn-square" aria-label="Square">x²</button>
                <button type="button" onclick="addValue('^')" class="scientific" id="btn-power" aria-label="Power">xʸ</button>
                <button type="button" onclick="deleteLast()" class="scientific" id="btn-backspace" aria-label="Backspace">⌫</button>

                <!-- Row 2: Clear, Sign Toggle, Percentage, Divide -->
                <button type="button" onclick="clearDisplay()" class="clear">AC</button>
                <button type="button" onclick="toggleSign()" class="scientific" id="btn-sign" aria-label="Sign Toggle">+/-</button>
                <button type="button" onclick="percentage()" class="scientific" id="btn-percent" aria-label="Percentage">%</button>
                <button type="button" onclick="addValue('/')" class="operator">÷</button>

                <!-- Row 3 -->
                <button type="button" onclick="addValue('7')">7</button>
                <button type="button" onclick="addValue('8')">8</button>
                <button type="button" onclick="addValue('9')">9</button>
                <button type="button" onclick="addValue('*')" class="operator">×</button>

                <!-- Row 4 -->
                <button type="button" onclick="addValue('4')">4</button>
                <button type="button" onclick="addValue('5')">5</button>
                <button type="button" onclick="addValue('6')">6</button>
                <button type="button" onclick="addValue('-')" class="operator">−</button>

                <!-- Row 5 -->
                <button type="button" onclick="addValue('1')">1</button>
                <button type="button" onclick="addValue('2')">2</button>
                <button type="button" onclick="addValue('3')">3</button>
                <button type="button" onclick="addValue('+')" class="operator">+</button>

                <!-- Row 6 -->
                <button type="button" onclick="addValue('0')" class="zero">0</button>
                <button type="button" onclick="addValue('.')">.</button>
                <button type="button" onclick="calculate()" class="equals">=</button>
            </div>

            <div class="calculator-footer">
                <button id="themeToggle" type="button">
                    Switch to Dark Mode
                </button>
                <p>Made for everyday calculations</p>
            </div>

        </div>

        <!-- History Side Panel -->
        <aside class="history-panel" id="historyPanel" aria-label="Calculation History">
            <div class="history-header">
                <h3>History</h3>
                <div class="history-actions">
                    <button type="button" id="clearHistoryBtn" onclick="clearHistory()" class="history-clear-btn" aria-label="Clear all history">Clear</button>
                    <button type="button" id="closeHistoryBtn" class="history-close-btn" aria-label="Close history">✕</button>
                </div>
            </div>
            <div id="historyList" class="history-list">
                <p class="history-empty">No calculations yet</p>
            </div>
        </aside>

    </div>

    <script src="script.js"></script>

</body>

</html>
